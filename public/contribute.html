<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <title>WAGUESS — Partager ma position pour le trafic</title>
    <style>
      :root {
        --bg: #0b1016;
        --card: #131b24;
        --fg: #e8eef4;
        --muted: #93a3b3;
        --line: #243242;
        --accent: #29d3a2;
        --warn: #f2b84b;
        --error: #ff6b6b;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f7fa;
          --card: #ffffff;
          --fg: #0f1a24;
          --muted: #4d6073;
          --line: #d5dee7;
          --accent: #0a8f6a;
          --warn: #946200;
          --error: #c0392b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px max(16px, env(safe-area-inset-right)) 32px
          max(16px, env(safe-area-inset-left));
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        display: grid;
        gap: 14px;
      }
      h1 {
        font-size: 1.35rem;
        margin: 8px 0 0;
      }
      h2 {
        font-size: 1rem;
        margin: 0 0 6px;
      }
      p,
      ul {
        margin: 0;
      }
      ul {
        padding-left: 1.1rem;
        display: grid;
        gap: 4px;
      }
      .brand {
        letter-spacing: 0.14em;
        font-size: 0.8rem;
        color: var(--accent);
        font-weight: 700;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
      }
      .muted {
        color: var(--muted);
      }
      label {
        display: block;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }
      .row input[type='checkbox'] {
        margin-top: 5px;
        width: 20px;
        height: 20px;
        accent-color: var(--accent);
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      legend {
        padding: 0;
        margin-bottom: 6px;
        font-weight: 600;
      }
      .choice {
        flex: 1 1 140px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .choice input {
        accent-color: var(--accent);
      }
      input[type='text'] {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: transparent;
        color: var(--fg);
        font: inherit;
      }
      .buttons {
        display: grid;
        gap: 10px;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 14px;
        border-radius: 12px;
        border: 0;
        cursor: pointer;
        min-height: 52px;
      }
      #start {
        background: var(--accent);
        color: #04130e;
      }
      #stop {
        background: transparent;
        color: var(--error);
        border: 2px solid var(--error);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      #state {
        font-weight: 700;
      }
      #state[data-on='true'] {
        color: var(--accent);
      }
      #message[data-tone='warn'] {
        color: var(--warn);
      }
      #message[data-tone='error'] {
        color: var(--error);
      }
      #message[data-tone='ok'] {
        color: var(--accent);
      }
      dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 12px;
        margin: 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">WAGUESS</div>
      <h1 data-t="title">Partager ma position pour le trafic</h1>
      <p class="muted" data-t="lead"></p>

      <section class="card" aria-labelledby="what">
        <h2 id="what" data-t="whatTitle"></h2>
        <ul>
          <li data-t="what1"></li>
          <li data-t="what2"></li>
        </ul>
      </section>

      <section class="card" aria-labelledby="not">
        <h2 id="not" data-t="notTitle"></h2>
        <ul>
          <li data-t="not1"></li>
          <li data-t="not2"></li>
        </ul>
      </section>

      <section class="card">
        <label class="row">
          <input id="consent" type="checkbox" />
          <span data-t="consent"></span>
        </label>
      </section>

      <section class="card">
        <fieldset>
          <legend data-t="mode"></legend>
          <label class="choice"
            ><input type="radio" name="mode" value="car" checked />
            <span data-t="car"></span
          ></label>
          <label class="choice"
            ><input type="radio" name="mode" value="moto" />
            <span data-t="moto"></span
          ></label>
        </fieldset>
        <p style="margin-top: 12px">
          <label for="token" class="muted" data-t="token"></label>
          <input
            id="token"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </p>
      </section>

      <div class="buttons">
        <button id="start" type="button" disabled data-t="start">
          Démarrer le partage
        </button>
        <button id="stop" type="button" disabled data-t="stop">
          Arrêter et effacer
        </button>
      </div>

      <section class="card" aria-live="polite">
        <p><span id="state">—</span></p>
        <p id="message" class="muted"></p>
        <dl>
          <dt data-t="speed"></dt>
          <dd id="speed">—</dd>
          <dt data-t="accuracy"></dt>
          <dd id="accuracy">—</dd>
          <dt data-t="sent"></dt>
          <dd id="sent">0</dd>
          <dt data-t="lastSent"></dt>
          <dd id="last">—</dd>
        </dl>
      </section>

      <p class="muted" data-t="keepOpen"></p>
    </main>
    <script type="module" src="./contribute.js"></script>
  </body>
</html>
